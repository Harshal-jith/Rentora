{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error | Rentora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'rentals/css/styles.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem;">
    <div class="glass-effect" style="padding: 3rem 2rem; border-radius: 24px; max-width: 500px; width: 100%;">
        <div style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">500 - Server Error</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">An unexpected internal error occurred on our server. Our technical team has been notified.</p>
        <a href="/" class="btn-primary-custom" style="padding: 0.85rem 2rem; text-decoration: none;">
            <i class="fa-solid fa-house"></i> Return to Home Page
        </a>
    </div>
</body>
</html>
